services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmc-app
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-5001}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-vmc_db}
      - POSTGRES_USER=${POSTGRES_USER:-vmc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vmc_password}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_TTL=${REDIS_TTL:-300}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: vmc-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-vmc_db}
      - POSTGRES_USER=${POSTGRES_USER:-vmc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vmc_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vmc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
